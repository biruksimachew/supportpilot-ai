# ============================================================
# SupportPilot AI
# Local Supabase configuration
# ============================================================

project_id = "supportpilot-ai"


# ============================================================
# API
# ============================================================

[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000


[api.tls]
enabled = false


# ============================================================
# DATABASE
# ============================================================

[db]
port = 55322
shadow_port = 55320
health_timeout = "2m"
major_version = 17


[db.pooler]
enabled = false
port = 55329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100


[db.migrations]
enabled = true
schema_paths = []


[db.seed]
enabled = true
sql_paths = ["./seed.sql"]


[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]


# ============================================================
# REALTIME
#
# Not required for the current foundation milestone.
# Can be enabled later if we use Supabase Realtime for the
# agent console.
# ============================================================

[realtime]
enabled = false


# ============================================================
# SUPABASE STUDIO
# ============================================================

[studio]
enabled = true
port = 55323
api_url = "http://127.0.0.1:55321"


# ============================================================
# LOCAL EMAIL TESTING
#
# Current CLI prefers [local_smtp] over deprecated [inbucket].
# ============================================================

[local_smtp]
enabled = true
port = 55324
smtp_port = 55325
pop3_port = 55326


# ============================================================
# STORAGE
#
# Disabled during foundation work because SupportPilot does
# not currently require Supabase Storage.
# ============================================================

[storage]
enabled = false
file_size_limit = "50MiB"


# ============================================================
# AUTHENTICATION
# ============================================================

[auth]
enabled = true

# Local Next.js application URL.
site_url = "http://127.0.0.1:3000"

# Exact permitted post-authentication redirects.
additional_redirect_urls = [
  "http://127.0.0.1:3000",
  "http://localhost:3000"
]

# Access-token lifetime in seconds.
jwt_expiry = 3600

# Refresh-token security.
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# SupportPilot staff accounts are provisioned deliberately.
# Public self-registration is disabled.
enable_signup = false

# Anonymous Supabase Auth users are not permitted.
enable_anonymous_sign_ins = false

# Manual identity linking is not required.
enable_manual_linking = false

# Local authentication password baseline.
minimum_password_length = 6
password_requirements = ""


# ============================================================
# AUTH RATE LIMITS
# ============================================================

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30


# ============================================================
# EMAIL AUTH
# ============================================================

[auth.email]

# No public email signup.
enable_signup = true

double_confirm_changes = true
enable_confirmations = false
secure_password_change = false

max_frequency = "1s"

otp_length = 6
otp_expiry = 3600


# ============================================================
# SMS AUTH
#
# Disabled for signup; retained only as valid Auth config.
# ============================================================

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"


# ============================================================
# MULTI-FACTOR AUTH
# ============================================================

[auth.mfa]
max_enrolled_factors = 10


[auth.mfa.totp]
enroll_enabled = false
verify_enabled = false


[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"


# ============================================================
# OAUTH SERVER
# ============================================================

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false


# ============================================================
# EDGE FUNCTIONS
#
# SupportPilot uses FastAPI as its application backend.
# Supabase Edge Functions are unnecessary for the MVP.
# ============================================================

[edge_runtime]
enabled = false
policy = "oneshot"
inspector_port = 8083
deno_version = 2


# ============================================================
# SUPABASE ANALYTICS / LOGFLARE
#
# Disabled because local Analytics on Windows introduces an
# unnecessary Docker-daemon dependency for this project.
# ============================================================

[analytics]
enabled = false
port = 55327
vector_port = 55328
backend = "postgres"