services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile

    container_name: supportpilot-api

    environment:
      APP_NAME: "${APP_NAME:-SupportPilot AI}"
      APP_ENV: "${APP_ENV:-local}"

      DATABASE_URL: "${DATABASE_URL}"

      CHAT_SESSION_SECRET: "${CHAT_SESSION_SECRET}"
      CHAT_SESSION_TTL_MINUTES: "${CHAT_SESSION_TTL_MINUTES:-480}"

      WEB_ORIGIN: "${WEB_ORIGIN:-http://127.0.0.1:3000}"

      SUPABASE_URL: "${SUPABASE_URL:-http://host.docker.internal:55321}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"

      EMAIL_INGEST_SECRET: "${EMAIL_INGEST_SECRET}"

      EMAIL_OUTBOUND_SECRET: "${EMAIL_OUTBOUND_SECRET}"
      N8N_EMAIL_OUTBOUND_URL: "${N8N_EMAIL_OUTBOUND_URL:-http://n8n:5678/webhook/supportpilot-email-outbound}"
      EMAIL_OUTBOUND_TIMEOUT_SECONDS: "${EMAIL_OUTBOUND_TIMEOUT_SECONDS:-30}"

      # ------------------------------------------------------
      # Embeddings
      # ------------------------------------------------------

      EMBEDDING_PROVIDER: "${EMBEDDING_PROVIDER:-local}"
      EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
      EMBEDDING_TIMEOUT_SECONDS: "${EMBEDDING_TIMEOUT_SECONDS:-30}"

      LOCAL_EMBEDDING_MODEL: "${LOCAL_EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}"
      LOCAL_EMBEDDING_NATIVE_DIMENSIONS: "${LOCAL_EMBEDDING_NATIVE_DIMENSIONS:-384}"
      LOCAL_EMBEDDING_CACHE_DIR: "${LOCAL_EMBEDDING_CACHE_DIR:-/var/cache/fastembed}"

      # Optional production embedding provider.
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"

      GENERATION_PROVIDER: "${GENERATION_PROVIDER:-ollama}"
      GENERATION_TIMEOUT_SECONDS: "${GENERATION_TIMEOUT_SECONDS:-180}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://ollama:11434}"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen3:1.7b}"

      EVIDENCE_HIGH_SIMILARITY: "${EVIDENCE_HIGH_SIMILARITY:-0.73}"
      EVIDENCE_MEDIUM_SIMILARITY: "${EVIDENCE_MEDIUM_SIMILARITY:-0.58}"
      EVIDENCE_AMBIGUITY_MARGIN: "${EVIDENCE_AMBIGUITY_MARGIN:-0.04}"
      EVIDENCE_CONFLICT_MIN_SIMILARITY: "${EVIDENCE_CONFLICT_MIN_SIMILARITY:-0.58}"

      COMMERCE_PROVIDER: "${COMMERCE_PROVIDER:-mock}"
      COMMERCE_MOCK_BASE_URL: "${COMMERCE_MOCK_BASE_URL:-http://commerce-mock:8080}"
      COMMERCE_TIMEOUT_SECONDS: "${COMMERCE_TIMEOUT_SECONDS:-10}"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    ports:
      - "${API_PORT:-8001}:8000"

    volumes:
      - ./services/api:/app
      - ./docs/evidence:/evidence
      - supportpilot_fastembed_cache:/var/cache/fastembed

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    depends_on:
      commerce-mock:
        condition: service_healthy

    restart: unless-stopped



  n8n:
    image: docker.n8n.io/n8nio/n8n:2.33.7

    container_name: supportpilot-n8n

    restart: unless-stopped

    ports:
      - "${N8N_HOST_PORT:-5680}:5678"

    environment:
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY}"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      N8N_EDITOR_BASE_URL: "http://localhost:${N8N_HOST_PORT:-5680}"
      WEBHOOK_URL: "http://localhost:${N8N_HOST_PORT:-5680}/"

      TZ: "UTC"
      GENERIC_TIMEZONE: "UTC"

    volumes:
      - supportpilot_n8n_data:/home/node/.n8n

    depends_on:
      api:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    container_name: supportpilot-ollama

    ports:
      - "${OLLAMA_HOST_PORT:-11435}:11434"

    volumes:
      - supportpilot_ollama_data:/root/.ollama

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

    restart: unless-stopped

  commerce-mock:
    build:
      context: ./services/commerce-mock
      dockerfile: Dockerfile

    container_name: supportpilot-commerce-mock

    expose:
      - "8080"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=3)"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

    restart: unless-stopped

volumes:
  supportpilot_n8n_data:
  supportpilot_fastembed_cache:
  supportpilot_ollama_data: