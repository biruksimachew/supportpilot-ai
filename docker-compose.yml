services:
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile

    container_name: supportpilot-api

    environment:
      APP_NAME: ${APP_NAME:-SupportPilot AI}
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL}
      CHAT_SESSION_SECRET: ${CHAT_SESSION_SECRET}
      CHAT_SESSION_TTL_MINUTES: ${CHAT_SESSION_TTL_MINUTES:-480}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:3000}
      SUPABASE_URL: ${SUPABASE_URL:-http://host.docker.internal:55321}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}


    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8001}:8000"

    volumes:
      - ./services/api:/app

    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    restart: unless-stopped